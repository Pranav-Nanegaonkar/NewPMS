# ==============================
# Application Configuration
# ==============================
spring.application.name=project-management-system
server.port=8080
# ==============================
# Database Configuration
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/project_management_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql@123
# ==============================
# JPA / Hibernate Configuration
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ==============================
# JWT Configuration
# ==============================
# JWT secret key (minimum 256 bits / 32 characters for HS256)
# IMPORTANT: Change this to a secure random value in production
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000
jwt.issuer=PMS
# ==============================
# CORS Configuration
# ==============================
cors.allowed-origins=http://localhost:5173
# Global default logging level
logging.level.root=INFO
logging.level.com.pms=DEBUG
# Optional: Logging level for Spring framework web logs
logging.level.org.springframework.web=WARN
